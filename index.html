<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Instruments Directory</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        :root {
            --text-main: #f8b0bb;
            --text-muted: #60cad2;
            --text-accent-pink: #48a944;
            --text-accent-blue: #f8b0bb;
            --btn-orange: #f59023;
            --btn-orange-hover: #ec6a00;
            --input-bg: rgba(255, 253, 248, 0.85);
            --border-color: rgba(217, 119, 54, 0.35);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(20, 15, 15, 0.2), rgba(20, 15, 15, 0.2)), 
                        url('https://i.pinimg.com/1200x/5d/9e/b6/5d9eb6a94e1e419f858d9c429f3e6647.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'Georgia', serif;
            color: var(--text-main);
            letter-spacing: 0.1em;
        }

        .arts-card {
            width: 90%;
            max-width: 460px;
            padding: 45px 40px;
            background: linear-gradient(rgba(252, 248, 240, 0.82), rgba(252, 248, 240, 0.82)), 
                        url('https://i.pinimg.com/1200x/15/de/50/15de50435aae1efb6922018257f37cb0.jpg') center center;
            background-size: cover;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column; align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        .form-icon {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: absolute;
            top: -35px;
            background: #fff;
        }

        .portal-title {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-accent-blue);
            margin-top: 35px;
            margin-bottom: 6px;
            text-align: center;
        }

        .portal-subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-accent-pink);
            letter-spacing: 0.2em;
            margin-bottom: 35px;
            text-align: center;
        }

        .input-group { 
            width: 100%; 
            display: flex; 
            flex-direction: column;
            gap: 20px; 
            margin-bottom: 30px; 
        }
        
        .input-wrap { 
            width: 100%; 
            position: relative; 
        }
        
        .input-wrap label { 
            font-size: 0.65rem; 
            font-weight: 400; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.2em; 
            display: block;
            margin-bottom: 8px; 
        }

        .arts-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            color: #4a4238;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', 'Songti SC', 'Georgia', serif;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }
        
        .arts-input:focus {
            outline: none;
            border-color: var(--btn-orange);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(217, 119, 54, 0.2);
        }
        
        .arts-input::placeholder { 
            color: #a39b92; 
            font-style: normal;
        }

        .btn-wrapper { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
        }
        
        .btn-arts {
            width: 100%;
            padding: 14px;
            background: var(--btn-orange);
            color: #fdfbf7;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.15s ease;
            box-shadow: 0 4px 12px rgba(217, 119, 54, 0.3);
            font-family: 'Noto Serif SC', 'Songti SC', 'Georgia', serif;
        }
        
        .btn-arts:hover { 
            background: var(--btn-orange-hover); 
            transform: translateY(-1px);
        }

        .btn-arts:active {
            transform: translateY(1px);
        }

        .result-wrapper { 
            margin-top: 25px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
        }
        
        #result-area {
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.7;
            letter-spacing: 0.05em;
            padding: 16px 18px;
            background: rgba(245, 240, 230, 0.9);
            color: #4a4238;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="arts-card">
        <img src="https://i.pinimg.com/1200x/86/2e/11/862e1184976a06c95f188d7f0e2cd036.jpg" alt="Weather Icon" class="form-icon">
        
        <h1 class="portal-title">氣 象 儀 器</h1>
        <div class="portal-subtitle">— Weather Instruments Directory —</div>

        <div class="input-group">
            <div class="input-wrap">
                <label for="instrument-input">Weather Instrument Name</label>
                <input type="text" id="instrument-input" class="arts-input" placeholder="e.g. Barometer, Rain Gauge...">
            </div>
        </div>

        <div class="btn-wrapper">
            <button id="search-btn" class="btn-arts" py-click="search_instrument">Search Instrument</button>
        </div>

        <div class="result-wrapper">
            <div id="result-area" role="alert">
                information will appear here !
            </div>
        </div>
    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
